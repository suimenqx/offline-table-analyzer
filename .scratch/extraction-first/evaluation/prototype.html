<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提取草稿评估原型 · 可丢弃</title>
<style>
  :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; background: #f6f7f7; color: #182b30; }
  body { max-width: 1100px; margin: auto; padding: 24px; }
  h1, h2, h3 { line-height: 1.2; }
  .note { background: #e8f1ef; border-left: 4px solid #197766; padding: 12px 16px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1fr); gap: 20px; }
  section, .panel { background: white; border: 1px solid #ccd6d6; border-radius: 8px; padding: 16px; margin: 16px 0; }
  textarea { box-sizing: border-box; width: 100%; min-height: 260px; font: 14px/1.5 ui-monospace, monospace; }
  button { border: 1px solid #8aa5a1; border-radius: 6px; background: #f7fbfa; padding: 6px 10px; color: inherit; cursor: pointer; margin: 3px; }
  button:hover, button:focus-visible { outline: 2px solid #197766; }
  button.primary { background: #197766; color: white; border-color: #197766; }
  .muted { color: #506165; }
  .small { font-size: 0.88rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bdcccc; padding: 3px 6px; text-align: left; }
  td button, th button { font: inherit; display: block; width: 100%; text-align: left; margin: 0; border: 0; background: transparent; }
  .residual { white-space: pre-wrap; font: 13px ui-monospace, monospace; background: #fff7df; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>提取草稿评估原型</h1>
<p class="note"><strong>可丢弃的逻辑演示。</strong>要验证的问题：从一段粘贴内容自动提出表格草稿，同时展示每个值的原文位置、未解释片段和关系候选，用户能否直接发现并纠正明显问题？它不代表正式产品，也不保证识别准确。</p>
<section>
  <h2>引导场景</h2>
  <div role="tablist" aria-label="评估场景">
    <button type="button" role="tab" data-scene="mixed" aria-selected="true">表格与说明混合</button>
    <button type="button" role="tab" data-scene="header" aria-selected="false">表头有歧义</button>
    <button type="button" role="tab" data-scene="multi" aria-selected="false">两张表与关联</button>
  </div>
  <p id="sceneDescription"></p>
  <div id="sceneSteps" class="actions"></div>
</section>
<div class="grid">
  <section>
    <h2>原文</h2>
    <label for="source">粘贴内容</label>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="actions">
      <button id="draft" class="primary" type="button">生成提取草稿</button>
      <button id="addSelection" type="button">从选中的原文补提一张表</button>
      <label><input id="replaceMode" type="checkbox"> 用原文选区替换所点单元格</label>
    </div>
    <p class="small muted">点击结果单元格会定位原文。若要纠正值，先在原文中选中正确字符，再勾选“替换”并点击单元格。所有操作只在当前页面内存中生效；重新生成草稿会清空修正。</p>
  </section>
  <section>
    <h2>当前结果</h2>
    <p id="summary" aria-live="polite"></p>
    <div id="tables"></div>
    <h3>未解释的原文</h3>
    <div id="residuals"></div>
    <h3>待确认的关联</h3>
    <div id="relations"></div>
    <h3>本轮修正</h3>
    <ol id="history"></ol>
    <p id="feedback" role="status" aria-live="polite"></p>
  </section>
</div>
<script id="draft-core">
/* Pure, throwaway extraction logic. The evaluation runner executes this exact block. */
globalThis.DraftPrototype = (() => {
  const SEPARATORS = [',', '\t', ';', '|', 'space'];
  const isDecoration = line => /^\s*(?:[+=|-]{3,}|[|:\s-]{5,})\s*$/.test(line);
  function lines(text, base = 0) {
    const found = [];
    const re = /([^\r\n]*)(\r\n|\n|\r|$)/g;
    let match;
    while ((match = re.exec(text))) {
      if (match[0] === '' && re.lastIndex === text.length) break;
      found.push({ text: match[1], start: base + match.index, end: base + match.index + match[1].length });
      if (!match[2]) break;
    }
    return found;
  }
  function tokenize(line, sep) {
    if (sep === 'space') {
      return [...line.text.matchAll(/\S+/g)].map(m => ({ value: m[0], start: line.start + m.index, end: line.start + m.index + m[0].length }));
    }
    const text = line.text;
    const raw = [];
    let from = 0;
    let quoted = false;
    for (let i = 0; i <= text.length; i++) {
      if (i < text.length && text[i] === '"') {
        if (quoted && text[i + 1] === '"') { i++; continue; }
        quoted = !quoted;
      }
      if (i === text.length || (text[i] === sep && !quoted && !(sep === '|' && i > 0 && text[i - 1] === '\\'))) {
        const segment = text.slice(from, i);
        const left = segment.length - segment.trimStart().length;
        const right = segment.trimEnd().length;
        const literal = segment.slice(left, right);
        let value = literal;
        if (value.startsWith('"') && value.endsWith('"') && value.length >= 2) value = value.slice(1, -1).replace(/""/g, '"');
        if (sep === '|') value = value.replace(/\\\|/g, '|');
        raw.push({ value, start: line.start + from + left, end: line.start + from + right });
        from = i + 1;
      }
    }
    if (sep === '|' && text.trimStart().startsWith('|')) raw.shift();
    if (sep === '|' && text.trimEnd().endsWith('|')) raw.pop();
    return raw;
  }
  function tableFromRows(sourceRows, sep, headerFromFirst) {
    const width = sourceRows[0].cells.length;
    const headers = headerFromFirst ? sourceRows[0].cells.map(c => c.value) : Array.from({ length: width }, (_, i) => 'Column' + (i + 1));
    const data = sourceRows.slice(headerFromFirst ? 1 : 0);
    return {
      separator: sep,
      sourceRows,
      headerFromFirst,
      headers,
      headerCells: headerFromFirst ? sourceRows[0].cells : [],
      rows: data.map(line => line.cells.map(c => c.value)),
      cells: data.map(line => line.cells.map(c => ({ start: c.start, end: c.end }))),
      start: sourceRows[0].start,
      end: sourceRows[sourceRows.length - 1].end
    };
  }
  function candidate(group) {
    let best = null;
    for (const sep of SEPARATORS) {
      let run = [];
      const consider = () => {
        if (run.length < 2) return;
        const width = run[0].cells.length;
        if (sep === 'space' && run.some(r => r.cells.some(c => c.value === '|'))) return;
        if (sep === 'space' && run.length < 3 && !run.slice(1).some(r => r.cells.some(c => /\d/.test(c.value)))) return;
        const score = run.length * width + (sep === 'space' ? 0 : 2);
        if (!best || score > best.score) best = { score, sep, run: run.slice() };
      };
      for (const line of group.concat([{ text: '', start: 0, end: 0 }])) {
        if (isDecoration(line.text)) continue;
        const cells = tokenize(line, sep);
        if (cells.length < 2 || (sep === '|' && cells.every(c => /^:?-{2,}:?$/.test(c.value)))) {
          consider(); run = []; continue;
        }
        if (run.length && cells.length !== run[0].cells.length) { consider(); run = []; }
        run.push({ cells, start: line.start, end: line.end });
      }
    }
    if (!best) return null;
    const first = best.run[0].cells;
    const second = best.run[1].cells;
    const labels = first.every(c => /[A-Za-z_\u4e00-\u9fff]/.test(c.value));
    const numericNext = second.some(c => /\d/.test(c.value));
    const headerFromFirst = labels && (numericNext || best.run.length >= 3);
    return tableFromRows(best.run, best.sep, headerFromFirst);
  }
  function relationships(tables, decisions) {
    const result = [];
    for (let i = 0; i < tables.length; i++) for (let j = i + 1; j < tables.length; j++) {
      tables[i].headers.forEach((left, li) => tables[j].headers.forEach((right, ri) => {
        if (!/id$/i.test(left) || !/id$/i.test(right)) return;
        const a = tables[i].rows.map(r => r[li]).filter(Boolean);
        const b = tables[j].rows.map(r => r[ri]).filter(Boolean);
        const shared = a.filter(v => b.includes(v));
        if (!shared.length) return;
        if (new Set(a).size < a.length && new Set(b).size < b.length) return;
        const key = i + ':' + li + ':' + j + ':' + ri;
        result.push({ key, leftTable: i, left, rightTable: j, right, shared: [...new Set(shared)].length, status: decisions[key] || '待确认' });
      }));
    }
    return result;
  }
  function finish(source, tables, corrections = [], relationshipDecisions = {}) {
    const covered = tables.flatMap(t => t.sourceRows.map(r => ({ start: r.start, end: r.end }))).sort((a, b) => a.start - b.start);
    const residuals = [];
    let cursor = 0;
    for (const range of covered.concat([{ start: source.length, end: source.length }])) {
      if (range.start > cursor) {
        const raw = source.slice(cursor, range.start);
        if (raw.trim()) residuals.push({ text: raw.trim(), start: cursor, end: range.start });
      }
      cursor = Math.max(cursor, range.end);
    }
    return { source, tables, residuals, relationships: relationships(tables, relationshipDecisions), relationshipDecisions, corrections };
  }
  function extract(source) {
    const groups = [];
    let group = [];
    for (const line of lines(source).concat([{ text: '', start: source.length, end: source.length }])) {
      if (!line.text.trim()) {
        if (group.length) groups.push(group);
        group = [];
      } else group.push(line);
    }
    return finish(source, groups.map(candidate).filter(Boolean));
  }
  function correct(state, action) {
    const tables = state.tables.slice();
    const corrections = state.corrections.concat([action]);
    const relationshipDecisions = { ...state.relationshipDecisions };
    if (action.type === 'header') {
      const old = tables[action.table];
      if (!old) return state;
      tables[action.table] = tableFromRows(old.sourceRows, old.separator, action.value);
    } else if (action.type === 'ignore') {
      if (!tables[action.table]) return state;
      tables.splice(action.table, 1);
    } else if (action.type === 'add-range') {
      if (action.end <= action.start) return state;
      const proposed = candidate(lines(state.source.slice(action.start, action.end), action.start).filter(l => l.text.trim()));
      if (!proposed || tables.some(t => proposed.start < t.end && proposed.end > t.start)) return state;
      tables.push(proposed);
      tables.sort((a, b) => a.start - b.start);
    } else if (action.type === 'replace-cell') {
      const old = tables[action.table];
      if (!old || action.end <= action.start || action.start < 0 || action.end > state.source.length) return state;
      const next = { ...old, rows: old.rows.map(r => r.slice()), cells: old.cells.map(r => r.map(c => ({ ...c }))) };
      if (!next.rows[action.row] || !next.cells[action.row][action.column]) return state;
      next.rows[action.row][action.column] = state.source.slice(action.start, action.end);
      next.cells[action.row][action.column] = { start: action.start, end: action.end };
      tables[action.table] = next;
    } else if (action.type === 'relation') {
      if (!state.relationships.some(r => r.key === action.key)) return state;
      relationshipDecisions[action.key] = action.value;
    }
    return finish(state.source, tables, corrections, relationshipDecisions);
  }
  return { extract, correct };
})();
</script>
<script>
(() => {
  const byId = id => document.getElementById(id);
  const sourceEl = byId('source');
  const scenes = {
    mixed: {
      source: 'Exported at 10:00\n\nid,amount\nA1,10\nA2,20\n\nTotals are provisional',
      description: '检查表外说明是否仍能看见；点击结果可回到原文。试着忽略表，再选中原表格文本将它补提回来。',
      steps: ['生成草稿', '忽略表格', '恢复草稿']
    },
    header: {
      source: 'Name,City\nAlice,Paris\nBob,Rome',
      description: '短样本不能证明第一行一定是表头。切换“第一行是数据”和“第一行是表头”，观察行数与字段名。',
      steps: ['生成草稿', '第一行是数据', '第一行是表头']
    },
    multi: {
      source: 'table-data Inventory\nvalidflag ID Product\n1 1001 Widget_A\n1 1002 Widget_B\n\ntable-data Orders\nvalidflag OrderID ProductID\n1 5001 1001',
      description: '检查两张表是否分开，关联是否仅作为待确认候选。点击某个值查看它来自原文哪一段。',
      steps: ['生成草稿', '定位第一个数据值', '查看待确认关联']
    }
  };
  let state = DraftPrototype.extract('');
  let scene = 'mixed';
  const element = (tag, text, parent) => { const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (parent) parent.appendChild(node); return node; };
  const selectSource = (start, end) => { sourceEl.focus(); sourceEl.setSelectionRange(start, end); };
  function render(message = '') {
    byId('summary').textContent = state.tables.length + ' 张候选表 · ' + state.residuals.length + ' 段未解释原文 · ' + state.corrections.length + ' 次修正';
    byId('feedback').textContent = message;
    const holder = byId('tables'); holder.replaceChildren();
    state.tables.forEach((table, ti) => {
      const panel = element('div', undefined, holder); panel.className = 'panel';
      element('h3', '候选表 ' + (ti + 1) + ' · ' + table.rows.length + ' 条记录', panel);
      const actions = element('div', undefined, panel); actions.className = 'actions';
      const header = element('button', table.headerFromFirst ? '第一行改作数据' : '第一行改作表头', actions);
      header.type = 'button'; header.onclick = () => { state = DraftPrototype.correct(state, { type: 'header', table: ti, value: !table.headerFromFirst }); render('表头解释已改变。'); };
      const ignore = element('button', '忽略这张表', actions);
      ignore.type = 'button'; ignore.onclick = () => { state = DraftPrototype.correct(state, { type: 'ignore', table: ti }); render('该表已回到未解释原文。'); };
      const tableEl = element('table', undefined, panel);
      const head = element('tr', undefined, element('thead', undefined, tableEl));
      table.headers.forEach((value, ci) => {
        const th = element('th', undefined, head);
        const button = element('button', value, th);
        button.type = 'button';
        button.onclick = () => {
          const span = table.headerCells[ci];
          if (span) selectSource(span.start, span.end);
          else byId('feedback').textContent = '生成的字段名没有原文位置。';
        };
      });
      const body = element('tbody', undefined, tableEl);
      table.rows.forEach((row, ri) => {
        const tr = element('tr', undefined, body);
        row.forEach((value, ci) => {
          const td = element('td', undefined, tr);
          const button = element('button', value, td);
          button.type = 'button';
          button.onclick = () => {
            if (byId('replaceMode').checked) {
              state = DraftPrototype.correct(state, { type: 'replace-cell', table: ti, row: ri, column: ci, start: sourceEl.selectionStart, end: sourceEl.selectionEnd });
              byId('replaceMode').checked = false;
              render('已用选中的原文替换该值。');
            } else {
              const span = table.cells[ri][ci]; selectSource(span.start, span.end);
              byId('feedback').textContent = '已定位该值的原文范围：' + span.start + '–' + span.end;
            }
          };
        });
      });
    });
    const residuals = byId('residuals'); residuals.replaceChildren();
    if (!state.residuals.length) element('p', '没有未解释的非空内容。', residuals);
    state.residuals.forEach(r => {
      const button = element('button', r.text, residuals);
      button.className = 'residual'; button.type = 'button';
      button.onclick = () => selectSource(r.start, r.end);
    });
    const relations = byId('relations'); relations.replaceChildren();
    if (!state.relationships.length) element('p', '没有明显的关联候选。', relations);
    state.relationships.forEach(r => {
      const item = element('div', undefined, relations);
      element('p', '候选表 ' + (r.leftTable + 1) + '.' + r.left + ' ↔ 候选表 ' + (r.rightTable + 1) + '.' + r.right + '（' + r.shared + ' 个共同值，' + r.status + '）', item);
      const confirm = element('button', '确认关联', item); confirm.type = 'button';
      confirm.onclick = () => { state = DraftPrototype.correct(state, { type: 'relation', key: r.key, value: '已确认' }); render('已确认关联；原型不会自动执行 JOIN。'); };
      const reject = element('button', '排除关联', item); reject.type = 'button';
      reject.onclick = () => { state = DraftPrototype.correct(state, { type: 'relation', key: r.key, value: '已排除' }); render('已排除关联。'); };
    });
    const history = byId('history'); history.replaceChildren();
    state.corrections.forEach(action => {
      const label = action.type === 'header' ? '重设候选表 ' + (action.table + 1) + ' 的表头' :
        action.type === 'ignore' ? '忽略候选表 ' + (action.table + 1) :
        action.type === 'add-range' ? '从原文选区补提候选表' :
        action.type === 'relation' ? action.value + '关联候选' : '用原文选区替换单元格';
      element('li', label, history);
    });
  }
  function draft() { state = DraftPrototype.extract(sourceEl.value); render('已生成草稿；当前结果未经确认。'); }
  function loadScene(name) {
    scene = name;
    sourceEl.value = scenes[name].source;
    document.querySelectorAll('[data-scene]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.scene === name)));
    byId('sceneDescription').textContent = scenes[name].description;
    const steps = byId('sceneSteps'); steps.replaceChildren();
    scenes[name].steps.forEach(label => {
      const button = element('button', label, steps); button.type = 'button';
      button.onclick = () => {
        if (label === '生成草稿' || label === '恢复草稿') draft();
        else if (label === '忽略表格' && state.tables.length) { state = DraftPrototype.correct(state, { type: 'ignore', table: 0 }); render('表格已回到未解释原文。'); }
        else if (label === '第一行是数据' && state.tables.length) { state = DraftPrototype.correct(state, { type: 'header', table: 0, value: false }); render('第一行现在是数据。'); }
        else if (label === '第一行是表头' && state.tables.length) { state = DraftPrototype.correct(state, { type: 'header', table: 0, value: true }); render('第一行现在是表头。'); }
        else if (label === '定位第一个数据值' && state.tables[0]?.cells[0]?.[0]) { const span = state.tables[0].cells[0][0]; selectSource(span.start, span.end); }
        else if (label === '查看待确认关联') byId('relations').scrollIntoView({ behavior: 'instant' });
      };
    });
    draft();
  }
  document.querySelectorAll('[data-scene]').forEach(button => button.onclick = () => loadScene(button.dataset.scene));
  byId('draft').onclick = draft;
  byId('addSelection').onclick = () => {
    const previous = state;
    state = DraftPrototype.correct(state, { type: 'add-range', start: sourceEl.selectionStart, end: sourceEl.selectionEnd });
    render(state === previous ? '选区没有足够的重复字段证据，或与已有表重叠。' : '已从选区补提候选表。');
  };
  loadScene(scene);
})();
</script>
</body>
</html>
